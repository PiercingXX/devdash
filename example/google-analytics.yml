---
# Google Analytics 4. See doc/services/google-analytics.md to create the keyfile and find the property ID.
general:
  refresh: 600

projects:
  - name: example.com - Google Analytics
    name_options:
      color: yellow
    services:
      google_analytics:
        keyfile: my-keyfile.json
        property_id: 123456789
    widgets:
      - row:
          - col:
              size: 6
              elements:
                - name: ga.bar_users
                  options:
                    title: " Users - last 12 days "
                    start_date: 11_days_ago
                    bar_width: 5
                    bar_gap: 1
                    color: yellow
                - name: ga.bar_sessions
                  options:
                    title: " Sessions per month "
                    start_date: 11_months_ago
                    end_date: this_month
                    time_period: month
                    bar_width: 7
                    bar_gap: 1
                    color: red
          - col:
              size: 4
              elements:
                - name: ga.bar_new_returning
                  options:
                    start_date: 5_months_ago
                    end_date: this_month
                    time_period: month
                    metric: users
                    bar_width: 7
                    bar_gap: 2
                    height: 20
          - col:
              size: 2
              elements:
                - name: ga.box_real_time
                  options:
                    color: green
                - name: ga.box_total
                  options:
                    title: " Users this month "
                    metric: users
                    start_date: this_month
                    end_date: today
                    color: blue
                - name: ga.box_total
                  options:
                    title: " Engagement "
                    metric: engagement_rate
                    color: magenta
      - row:
          - col:
              size: 6
              elements:
                - name: ga.table_pages
                  options:
                    title: " Pages - last 7 days "
                    metrics: page_views,users,engagement_rate
                    character_limit: 30
                    row_limit: 6
                    color: cyan
          - col:
              size: 6
              elements:
                - name: ga.table_traffic_sources
                  options:
                    title: " Traffic sources - last 7 days "
                    metrics: sessions,users
                    row_limit: 6
                    color: green
